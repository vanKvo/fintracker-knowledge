[tool.poetry]
name = "knowledge-service"
version = "0.1.0"
description = "FinTracker Knowledge Service — vector store, retrieval and indexing of help docs (and later user documents)"
authors = ["Van Vo"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = "^2.0.40"
boto3 = "^1.43.117"
pyyaml = "^6.0.3"
aws-lambda-powertools = "^3.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
mypy = "^1.15.0"
psycopg = {extras = ["binary"], version = "^3.2.6"}
testcontainers = {extras = ["postgres"], version = "^4.15.0"}
types-pyyaml = "^6.0.12.20260906"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
